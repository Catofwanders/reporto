<title>Mail triage — {{DATE}}</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#171a21; --ink-2:#5c6472; --line:#e3e6ec;
    --accent:#2f54c9; --accent-ink:#2f54c9;
    --ok-bg:#e2f3e8; --ok-ink:#1c7a3d; --ok-line:#bfe3cc;
    --bad-bg:#fdeaea; --bad-ink:#c02626; --bad-line:#f3c6c6;
    --open-bg:#eef1fb; --open-ink:#3a56b8; --open-line:#d3dbf4;
    --na-bg:#eef0f3; --na-ink:#6a7280; --na-line:#dde1e7;
    --warn-bg:#fff7e8; --warn-ink:#8a5a00; --warn-line:#f0dfb6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111318; --panel:#181b22; --ink:#e7eaf1; --ink-2:#98a0af; --line:#2a2f3a;
      --accent:#8fa8ff; --accent-ink:#a5b8ff;
      --ok-bg:#12301d; --ok-ink:#63cf8b; --ok-line:#1e4a2d;
      --bad-bg:#3a1717; --bad-ink:#ff8a8a; --bad-line:#5a2424;
      --open-bg:#1c2338; --open-ink:#9db1f5; --open-line:#2c3a5e;
      --na-bg:#20242c; --na-ink:#8b94a3; --na-line:#2e3440;
      --warn-bg:#332a13; --warn-ink:#e6b95c; --warn-line:#4d3f1c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111318; --panel:#181b22; --ink:#e7eaf1; --ink-2:#98a0af; --line:#2a2f3a;
    --accent:#8fa8ff; --accent-ink:#a5b8ff;
    --ok-bg:#12301d; --ok-ink:#63cf8b; --ok-line:#1e4a2d;
    --bad-bg:#3a1717; --bad-ink:#ff8a8a; --bad-line:#5a2424;
    --open-bg:#1c2338; --open-ink:#9db1f5; --open-line:#2c3a5e;
    --na-bg:#20242c; --na-ink:#8b94a3; --na-line:#2e3440;
    --warn-bg:#332a13; --warn-ink:#e6b95c; --warn-line:#4d3f1c;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);margin:0;padding:2.5rem 1.25rem 4rem;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:60rem;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem 1rem;margin-bottom:1.2rem}
  h1{font-size:1.45rem;margin:0;letter-spacing:-.01em}
  .meta{color:var(--ink-2);font-size:.82rem}
  h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);
    margin:1.9rem 0 .55rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
  h2 .count{background:var(--na-bg);border:1px solid var(--na-line);color:var(--na-ink);
    border-radius:99px;padding:.1rem .5rem;font-size:.7rem;letter-spacing:0}
  .list{background:var(--panel);border:1px solid var(--line);border-radius:.55rem;overflow:hidden}
  .item{display:flex;gap:.9rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);align-items:flex-start}
  .item:last-child{border-bottom:none}
  .item .chip{margin-top:.1rem;flex:none}
  .item .body{min-width:0;flex:1}
  .item .action{flex:none;width:13rem;font-size:.8rem;padding-left:.9rem;border-left:1px solid var(--line)}
  .item .action.need{color:var(--bad-ink);font-weight:600}
  .item .action.none{color:var(--ink-2)}
  @media (max-width:640px){.item{flex-wrap:wrap}.item .action{width:100%;border-left:none;padding-left:0}}
  .item .top{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:baseline}
  .from{font-weight:600;font-size:.9rem}
  .time{color:var(--ink-2);font-size:.75rem;font-variant-numeric:tabular-nums}
  .subj{margin:.15rem 0 0;font-size:.88rem}
  .note{margin:.15rem 0 0;color:var(--ink-2);font-size:.8rem}
  .ref{font:500 .78rem/1 ui-monospace,"SF Mono",Menlo,monospace;white-space:nowrap}
  a{color:var(--accent-ink);text-decoration:none}
  a:hover,a:focus-visible{text-decoration:underline}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  .chip{display:inline-block;padding:.22rem .55rem;border-radius:99px;font-size:.7rem;
    font-weight:600;border:1px solid;white-space:nowrap}
  .chip.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
  .chip.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
  .chip.open{background:var(--open-bg);color:var(--open-ink);border-color:var(--open-line)}
  .chip.na{background:var(--na-bg);color:var(--na-ink);border-color:var(--na-line)}
  .chip.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
  .empty{padding:.9rem 1rem;color:var(--ink-2);font-size:.85rem}
  .foot{margin-top:1.6rem;color:var(--ink-2);font-size:.78rem}
</style>
<div class="wrap">
<header>
  <h1>Mail triage</h1>
  <span class="meta">{{DATE}} · {{ACCOUNTS}}</span>
</header>

<h2>{{INBOX_A_TITLE}} <span class="count">{{INBOX_A_COUNT}}</span></h2>
<div class="list">
<!-- INBOX_A_ITEMS: repeat .item blocks; chip classes: bad=action, warn=ping/review, ok=info, na=fyi.
     Last column .action: what's needed from ME — imperative + deadline, class "need";
     nothing needed = <div class="action none">—</div>
<div class="item"><span class="chip warn">ping</span><div class="body">
  <div class="top"><span class="from">Megan Smith</span><span class="time">3:20 PM</span><span class="ref"><a target="_blank" rel="noopener" href="PR_OR_TICKET_URL">backend-core#3525</a></span></div>
  <p class="subj"><a target="_blank" rel="noopener" href="MAIL_URL">Subject line here</a></p>
  <p class="note">One-line: what they want from me. Mention attachment if any.</p>
</div><div class="action need">Reply about X by Friday</div></div>
-->
{{INBOX_A_ITEMS}}
</div>

<h2>{{INBOX_B_TITLE}} <span class="count">{{INBOX_B_COUNT}}</span></h2>
<div class="list">
{{INBOX_B_ITEMS}}
</div>

<p class="foot">Filtered out: {{FILTERED_NOTE}}</p>
</div>
